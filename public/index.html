<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>your future</title>
<meta name="description" content="ตอบ 30 ข้อ แล้วดูอนาคตของคุณก่อนตัดสินใจกู้เงิน">
<meta property="og:title" content="your future"><meta property="og:description" content="จำลองอนาคตของคุณก่อนตัดสินใจกู้เงิน">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&family=Kanit:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef3fb;--bg2:#dfe9f8;--card:rgba(255,255,255,.78);--bd:rgba(20,50,100,.14);--tx:#0c1b33;--mu:#51617d;--ac:#0e9f8e;--ac2:#2f6bff;--opt:rgba(20,50,100,.06);--warn:#b4571a;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#050b1a;--bg2:#0a1630;--card:rgba(14,26,52,.72);--bd:rgba(140,180,255,.16);--tx:#eaf1ff;--mu:#9fb2d4;--ac:#2fd9c3;--ac2:#5b8cff;--opt:rgba(140,180,255,.07);--warn:#ffb46b;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#050b1a;--bg2:#0a1630;--card:rgba(14,26,52,.72);--bd:rgba(140,180,255,.16);--tx:#eaf1ff;--mu:#9fb2d4;--ac:#2fd9c3;--ac2:#5b8cff;--opt:rgba(140,180,255,.07);--warn:#ffb46b;color-scheme:dark}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;min-height:100%;font-family:'Anuphan','Noto Sans Thai',system-ui,sans-serif;color:var(--tx);background:var(--bg);overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.sky{position:fixed;inset:0;z-index:0;background:radial-gradient(60% 50% at 80% 0%,color-mix(in srgb,var(--ac2) 35%,transparent),transparent 70%),radial-gradient(50% 45% at 10% 100%,color-mix(in srgb,var(--ac) 28%,transparent),transparent 70%),linear-gradient(180deg,var(--bg),var(--bg2));animation:drift 14s ease-in-out infinite alternate}
@keyframes drift{to{filter:hue-rotate(18deg) brightness(1.08)}}
.stars{position:fixed;inset:0;z-index:0;opacity:.55;background-image:radial-gradient(1.5px 1.5px at 20% 30%,var(--tx),transparent),radial-gradient(1px 1px at 70% 20%,var(--tx),transparent),radial-gradient(1.5px 1.5px at 50% 80%,var(--tx),transparent),radial-gradient(1px 1px at 85% 65%,var(--tx),transparent),radial-gradient(1px 1px at 10% 70%,var(--tx),transparent);background-size:340px 340px;animation:tw 6s ease-in-out infinite alternate}
@keyframes tw{to{opacity:.25}}
.app{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:18px 18px 40px;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:6px 0 18px}
.logo{font-weight:700;letter-spacing:.2px;display:flex;gap:8px;align-items:center}
.logo i{width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 14px var(--ac)}
.snd{background:var(--opt);border:1px solid var(--bd);color:var(--tx);border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;cursor:pointer}
main{flex:1;display:flex;flex-direction:column;justify-content:center}
.card{background:var(--card);border:1px solid var(--bd);border-radius:24px;padding:26px 22px;backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);box-shadow:0 20px 60px rgba(0,0,0,.25);animation:in .32s cubic-bezier(.2,.8,.2,1)}
.card.out{animation:out .18s ease-in forwards}
@keyframes in{from{opacity:0;transform:translateY(14px) scale(.985)}}
@keyframes out{to{opacity:0;transform:translateX(-18px) scale(.985)}}
h1{font-size:clamp(30px,7vw,44px);line-height:1.2;margin:8px 0 12px;font-weight:700}
h1 em{font-style:normal;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
h2{font-size:clamp(20px,4.6vw,26px);line-height:1.35;margin:6px 0 18px;font-weight:600}
p{color:var(--mu);line-height:1.7;margin:0 0 16px}
.tag{display:inline-block;font-size:12px;color:var(--ac);border:1px solid var(--bd);padding:4px 10px;border-radius:999px;margin-bottom:6px}
.trust{display:grid;gap:8px;margin:18px 0 22px}
.trust div{display:flex;gap:10px;font-size:14px;color:var(--mu);align-items:flex-start}
.trust b{color:var(--ac)}
.prog{height:6px;border-radius:99px;background:var(--opt);overflow:hidden;margin:0 0 6px}
.prog span{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:width .4s ease}
.meta{display:flex;justify-content:space-between;font-size:12.5px;color:var(--mu);margin-bottom:14px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;width:100%;background:var(--opt);border:1px solid var(--bd);color:var(--tx);border-radius:14px;padding:14px 16px;font:inherit;font-size:15.5px;cursor:pointer;transition:transform .12s,border-color .15s,background .15s}
.opt:hover{border-color:var(--ac)}
.opt:active{transform:scale(.97)}
.opt .dot{flex:none;width:20px;height:20px;border-radius:50%;border:2px solid var(--bd)}
.opt.m .dot{border-radius:6px}
.opt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 16%,transparent)}
.opt.sel .dot{background:var(--ac);border-color:var(--ac);box-shadow:0 0 12px var(--ac)}
.opt.pop{animation:pp .25s}
@keyframes pp{40%{transform:scale(1.03)}}
textarea{width:100%;min-height:130px;resize:vertical;background:var(--opt);border:1px solid var(--bd);color:var(--tx);border-radius:14px;padding:14px;font:inherit;font-size:15.5px;line-height:1.6}
textarea:focus{outline:2px solid var(--ac);outline-offset:1px}
.row{display:flex;gap:10px;margin-top:20px}
.btn{flex:1;border:0;border-radius:14px;padding:14px 18px;font:inherit;font-weight:600;font-size:16px;cursor:pointer;color:#03221e;background:linear-gradient(90deg,var(--ac),var(--ac2));transition:transform .12s,opacity .2s}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.35;cursor:not-allowed}
.btn.g{flex:0 0 auto;background:var(--opt);color:var(--tx);border:1px solid var(--bd)}
.note{font-size:12.5px;color:var(--mu);margin-top:16px;line-height:1.6}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.sum div{background:var(--opt);border:1px solid var(--bd);border-radius:14px;padding:12px;font-size:13px;color:var(--mu)}
.sum b{display:block;color:var(--tx);font-size:16px;margin-top:2px}

/* ===== Liquid Glass premium layer ===== */
:root{--g1:rgba(255,255,255,.62);--g2:rgba(255,255,255,.28);--ge:rgba(255,255,255,.75);--gs:rgba(40,70,130,.22);--gt:rgba(255,255,255,.5)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--g1:rgba(255,255,255,.17);--g2:rgba(255,255,255,.05);--ge:rgba(255,255,255,.42);--gs:rgba(0,0,0,.45);--gt:rgba(255,255,255,.1)}}
:root[data-theme="dark"]{--g1:rgba(255,255,255,.17);--g2:rgba(255,255,255,.05);--ge:rgba(255,255,255,.42);--gs:rgba(0,0,0,.45);--gt:rgba(255,255,255,.1)}
.sky::before,.sky::after{content:"";position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.sky::before{width:52vmax;height:52vmax;left:-14vmax;top:-10vmax;background:radial-gradient(circle,color-mix(in srgb,var(--ac2) 70%,transparent),transparent 65%);animation:o1 18s ease-in-out infinite alternate}
.sky::after{width:46vmax;height:46vmax;right:-12vmax;bottom:-12vmax;background:radial-gradient(circle,color-mix(in srgb,var(--ac) 65%,transparent),transparent 65%);animation:o2 22s ease-in-out infinite alternate}
@keyframes o1{to{transform:translate(18vmax,12vmax) scale(1.15)}}
@keyframes o2{to{transform:translate(-16vmax,-10vmax) scale(1.1)}}
.card{position:relative;border-radius:34px;padding:30px 24px;background:linear-gradient(150deg,var(--g1),var(--g2));border:1px solid var(--gt);backdrop-filter:blur(34px) saturate(190%);-webkit-backdrop-filter:blur(34px) saturate(190%);box-shadow:inset 0 1.5px 0 var(--ge),inset 0 -1px 0 var(--gt),inset 0 0 40px rgba(255,255,255,.05),0 40px 90px var(--gs)}
.card::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background:linear-gradient(115deg,rgba(255,255,255,.28),transparent 32%,transparent 70%,rgba(255,255,255,.1))}
.card>*{position:relative}
h1{letter-spacing:-.5px;font-weight:700}
h2{letter-spacing:-.2px}
.snd{background:linear-gradient(150deg,var(--g1),var(--g2));border:1px solid var(--gt);box-shadow:inset 0 1px 0 var(--ge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.tag{background:linear-gradient(150deg,var(--g1),var(--g2));border:1px solid var(--gt);box-shadow:inset 0 1px 0 var(--ge)}
.prog{background:var(--gt);box-shadow:inset 0 1px 2px rgba(0,0,0,.2);height:7px}
.prog span{box-shadow:0 0 14px var(--ac)}
.opts{gap:12px}
.opt{position:relative;overflow:hidden;border-radius:22px;padding:16px 18px;background:linear-gradient(150deg,var(--g1),var(--g2));border:1px solid var(--gt);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);box-shadow:inset 0 1.5px 0 var(--ge),inset 0 -1px 0 var(--gt),0 10px 26px var(--gs);transition:transform .18s cubic-bezier(.3,1.5,.5,1),box-shadow .2s,background .2s,border-color .2s}
.opt::before{content:"";position:absolute;left:8%;right:8%;top:0;height:48%;border-radius:0 0 50% 50%/0 0 100% 100%;background:linear-gradient(180deg,rgba(255,255,255,.3),transparent);pointer-events:none}
.opt:hover{transform:translateY(-2px);border-color:var(--ge)}
.opt:active{transform:scale(.965)}
.opt .dot{position:relative;width:22px;height:22px;border:1.5px solid var(--ge);background:rgba(255,255,255,.12);box-shadow:inset 0 1px 2px rgba(255,255,255,.4)}
.opt.sel{border-color:color-mix(in srgb,var(--ac) 80%,white);background:linear-gradient(150deg,color-mix(in srgb,var(--ac) 48%,transparent),color-mix(in srgb,var(--ac2) 26%,transparent));box-shadow:inset 0 1.5px 0 var(--ge),inset 0 -1px 0 var(--gt),0 0 0 1px color-mix(in srgb,var(--ac) 60%,transparent),0 12px 34px color-mix(in srgb,var(--ac) 40%,transparent)}
.opt.sel .dot{background:radial-gradient(circle at 35% 30%,#fff,var(--ac));border-color:#fff;box-shadow:0 0 14px var(--ac)}
textarea{border-radius:22px;padding:16px;background:linear-gradient(150deg,var(--g1),var(--g2));border:1px solid var(--gt);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);box-shadow:inset 0 1.5px 0 var(--ge),inset 0 2px 10px rgba(0,0,0,.12)}
.btn{position:relative;overflow:hidden;border-radius:20px;padding:16px 20px;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.3);background:linear-gradient(150deg,color-mix(in srgb,var(--ac) 88%,white 0%),var(--ac2));border:1px solid rgba(255,255,255,.45);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.7),inset 0 -2px 6px rgba(0,0,0,.18),0 14px 34px color-mix(in srgb,var(--ac2) 45%,transparent)}
.btn::before{content:"";position:absolute;left:6%;right:6%;top:0;height:50%;border-radius:0 0 60% 60%/0 0 100% 100%;background:linear-gradient(180deg,rgba(255,255,255,.4),transparent);pointer-events:none}
.btn.g{color:var(--tx);text-shadow:none;background:linear-gradient(150deg,var(--g1),var(--g2));border:1px solid var(--gt);box-shadow:inset 0 1.5px 0 var(--ge),0 10px 24px var(--gs);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.sum div{border-radius:20px;background:linear-gradient(150deg,var(--g1),var(--g2));border:1px solid var(--gt);box-shadow:inset 0 1.5px 0 var(--ge)}
.hb{display:flex;gap:8px}.snd.off{opacity:.55}
.res h3{font-size:15px;margin:22px 0 8px;color:var(--ac);letter-spacing:.2px}
.res ul{margin:0;padding-left:18px;color:var(--mu);line-height:1.75;font-size:14.5px}
.mt{height:10px;border-radius:99px;background:var(--gt);overflow:hidden}.mt i{display:block;height:100%;border-radius:99px;transition:width .8s}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{padding:14px;border-radius:20px;background:linear-gradient(150deg,var(--g1),var(--g2));border:1px solid var(--gt);box-shadow:inset 0 1.5px 0 var(--ge)}
.tile small{color:var(--mu);font-size:12.5px}.tile b{display:block;font-size:22px;margin:4px 0 8px}
.scn{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px}
.scn .tile b{font-size:15px;margin:0 0 8px}.scn .tile p{font-size:13.5px;margin:0 0 6px;line-height:1.55}.scn .tile p span{color:var(--ac);font-weight:600}

.fl{display:block;margin-bottom:14px;font-size:13.5px;color:var(--mu)}
.fl input,.fl select{display:block;width:100%;margin-top:6px;padding:14px 16px;border-radius:18px;font:inherit;font-size:16px;color:var(--tx);background:linear-gradient(150deg,var(--g1),var(--g2));border:1px solid var(--gt);box-shadow:inset 0 1.5px 0 var(--ge);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px)}
.fl input:focus,.fl select:focus{outline:2px solid var(--ac);outline-offset:1px}
.fl option{color:#111}
.pv{font-size:13.5px;color:var(--mu);line-height:1.7;margin-top:4px}.pv b{color:var(--tx)}
.art{width:100%;max-width:240px;height:auto;margin:0 0 10px;display:block}

/* ===== Future video player ===== */
.vov{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(3,8,20,.55);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);opacity:0;transition:opacity .35s}
.vov.on{opacity:1}
.vp{--va:#5b8cff;--vb:#2fd9c3;--vc:#5b8cff;--v1:#0d2a5c;--v2:#1b6b8f;position:relative;width:min(100%,420px,calc((100vh - 32px)*9/16));aspect-ratio:9/16;border-radius:34px;overflow:hidden;color:#fff;box-shadow:0 40px 100px rgba(0,0,0,.55),inset 0 1.5px 0 rgba(255,255,255,.45);border:1px solid rgba(255,255,255,.22);transform:scale(.94);transition:transform .45s cubic-bezier(.2,1.2,.3,1)}
.vov.on .vp{transform:none}
.vp[data-m="good"]{--v1:#0b3b45;--v2:#1fa38f;--vb:#ffd24d;--vc:#2fd9a0}
.vp[data-m="ok"]{--v1:#0d2a5c;--v2:#2f6bff;--vb:#7ee8ff;--vc:#5b8cff}
.vp[data-m="bad"]{--v1:#3a1d2e;--v2:#b4571a;--vb:#ffb46b;--vc:#ff9a4d}
.vp[data-m="dark"]{--v1:#120c1c;--v2:#4a1630;--vb:#9b8bb3;--vc:#ff5d6c}
.vbg{position:absolute;inset:0;background:linear-gradient(170deg,var(--v1),var(--v2));transition:background 1.2s}
.vp .vbg{background:linear-gradient(170deg,var(--v1),var(--v2))}
@property --v1{syntax:'<color>';inherits:true;initial-value:#0d2a5c}@property --v2{syntax:'<color>';inherits:true;initial-value:#2f6bff}
.vp{transition:transform .45s cubic-bezier(.2,1.2,.3,1),--v1 1.2s,--v2 1.2s}
.vorb{position:absolute;border-radius:50%;filter:blur(40px);opacity:.55;pointer-events:none}
.vorb.a{width:70%;height:40%;left:-20%;top:8%;background:var(--vb);animation:o1 12s ease-in-out infinite alternate}
.vorb.b{width:60%;height:35%;right:-20%;bottom:10%;background:var(--vc);animation:o2 14s ease-in-out infinite alternate}
.rain{position:absolute;inset:0;opacity:0;transition:opacity 1s;background-image:repeating-linear-gradient(105deg,transparent 0 14px,rgba(255,255,255,.12) 14px 15px);background-size:60px 60px;animation:rain .5s linear infinite;pointer-events:none}
.vp[data-m="dark"] .rain{opacity:1}.vp[data-m="bad"] .rain{opacity:.35}
@keyframes rain{to{background-position:-20px 60px}}
.vbars{position:absolute;left:14px;right:14px;top:14px;display:flex;gap:4px;z-index:3}
.vbars i{flex:1;height:3px;border-radius:3px;background:rgba(255,255,255,.28);overflow:hidden}
.vbars b{display:block;height:100%;width:0;background:#fff;border-radius:3px}
.vtop{position:absolute;left:16px;right:12px;top:26px;display:flex;justify-content:space-between;align-items:center;z-index:4}
.vid{font-size:11.5px;opacity:.8;letter-spacing:.3px}
.vx,.vpp{border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.14);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);color:#fff;border-radius:999px;width:36px;height:36px;font:inherit;font-size:14px;cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.5)}
.vpp{position:absolute;right:14px;bottom:14px;z-index:4}
.vnav{position:absolute;inset:60px 0 70px;display:flex;z-index:2}
.vnav button{flex:1;background:none;border:0;cursor:pointer}.vnav .vprev{flex:.45}
.vsc{position:absolute;inset:0;z-index:3;pointer-events:none}
.vs{position:absolute;inset:66px 20px 64px;display:flex;flex-direction:column;align-items:center;text-align:center}
.vs>*{animation:vin .7s cubic-bezier(.2,.9,.2,1) both}
.vs>*:nth-child(2){animation-delay:.08s}.vs>*:nth-child(3){animation-delay:.22s}.vs>*:nth-child(4){animation-delay:.36s}.vs>*:nth-child(5){animation-delay:.5s}
@keyframes vin{from{opacity:0;transform:translateY(18px);filter:blur(6px)}}
.vt{font-size:13px;font-weight:600;padding:6px 14px;border-radius:999px;background:rgba(255,255,255,.16);border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1px 0 rgba(255,255,255,.5);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.vart{width:78%;max-height:42%;margin:10px 0 2px;overflow:visible;animation:vin .7s both,kb 6s ease-out both}
@keyframes kb{to{transform:scale(1.06)}}
.hero{animation:bob 3.2s ease-in-out infinite;transform-origin:100px 190px}
@keyframes bob{50%{transform:translateY(-4px)}}
.ic{animation:fl 4s ease-in-out infinite}@keyframes fl{50%{translate:0 -5px}}
.blink{animation:bl 4s infinite;transform-box:fill-box;transform-origin:center}@keyframes bl{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.sweat{animation:sw 1.6s ease-in infinite}@keyframes sw{to{transform:translateY(10px);opacity:0}}
.pulse{animation:pu 1.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}@keyframes pu{50%{transform:scale(1.3)}}
.draw{stroke-dasharray:300;stroke-dashoffset:300;animation:dr 1.6s .3s ease-out forwards}@keyframes dr{to{stroke-dashoffset:0}}
.bolt{animation:bo 2.4s infinite}@keyframes bo{0%,80%,100%{opacity:1}85%,92%{opacity:.2}}
.vv small{display:block;font-size:12.5px;opacity:.8}
.vn{display:block;font-size:clamp(28px,8.5vw,38px);font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums;text-shadow:0 4px 24px rgba(0,0,0,.25)}
.vn.neg{color:#ffb3bb}
.vc{margin:auto 0 0;color:#fff;font-size:15.5px;line-height:1.6;padding:14px 16px;border-radius:22px;background:linear-gradient(150deg,rgba(255,255,255,.22),rgba(255,255,255,.08));border:1px solid rgba(255,255,255,.3);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),0 12px 30px rgba(0,0,0,.2);backdrop-filter:blur(18px) saturate(160%);-webkit-backdrop-filter:blur(18px) saturate(160%)}
.vend{display:flex;gap:10px;width:100%;margin-top:12px;pointer-events:auto}
.vend .btn{padding:12px}
.vdis{font-size:11px;opacity:.7;margin-top:8px}
@media (prefers-reduced-motion:reduce){.vs>*,.vart,.hero,.ic,.rain,.vorb,.pulse,.draw,.bolt,.sweat,.blink{animation:none!important}.draw{stroke-dashoffset:0}}

[hidden]{display:none!important}
/* ===== Voice call with 3D advisor ===== */
.cv{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;height:100vh;height:100dvh;padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px);overflow:hidden}
.cvh{display:flex;align-items:center;gap:10px;padding:12px 18px 0;max-width:680px;width:100%;margin:0 auto;min-height:40px}
.cvh .prog{flex:1;margin:0}
.cvh small{font-size:12px;color:var(--mu);white-space:nowrap}
.cv .lg{display:none;font-weight:700;align-items:center;gap:8px}
.cv .lg i{width:10px;height:10px;border-radius:50%;background:var(--ac);box-shadow:0 0 14px var(--ac)}
.cv.idle .lg{display:flex}.cv.idle .cvh .prog,.cv.idle .cvh small{display:none}
.stage{position:relative;flex:1;min-height:0;max-width:680px;width:100%;margin:0 auto;cursor:pointer;-webkit-tap-highlight-color:transparent}
.stage canvas{position:absolute;inset:0;z-index:1;display:block;width:100%;height:100%}
.stage .glow{position:absolute;left:50%;bottom:2%;width:60%;height:14%;transform:translateX(-50%);border-radius:50%;background:radial-gradient(closest-side,color-mix(in srgb,var(--ac) 45%,transparent),transparent);filter:blur(8px);pointer-events:none;z-index:0}
/* topic motion card */
.topic{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:2;display:flex;align-items:center;gap:10px;max-width:calc(100% - 28px);padding:8px 18px 8px 10px;border-radius:999px;background:linear-gradient(150deg,var(--g1),var(--g2));border:1px solid var(--gt);box-shadow:inset 0 1.5px 0 var(--ge),0 12px 30px var(--gs);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);pointer-events:none;animation:tin .5s cubic-bezier(.2,1.3,.3,1)}
.topic .em{font-size:30px;line-height:1;display:inline-block;animation:em .9s cubic-bezier(.2,1.6,.3,1) both,bob2 2.6s 1s ease-in-out infinite}
.topic .tw{font-weight:700;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topic .tw span{display:inline-block;opacity:0;animation:wp .45s cubic-bezier(.2,1.4,.3,1) forwards}
@keyframes tin{from{opacity:0;transform:translate(-50%,-14px) scale(.9)}}
@keyframes em{0%{transform:scale(0) rotate(-30deg)}70%{transform:scale(1.25) rotate(8deg)}100%{transform:none}}
@keyframes bob2{50%{transform:translateY(-4px) rotate(-4deg)}}
@keyframes wp{from{opacity:0;transform:translateY(10px) scale(.8);filter:blur(4px)}to{opacity:1;transform:none;filter:none}}
.cap{max-width:620px;width:100%;margin:0 auto;padding:0 22px;min-height:3.2em;text-align:center;font-size:16px;line-height:1.6;color:var(--tx);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.cap.me{color:var(--mu);font-size:14.5px}
.vst{text-align:center;font-size:13px;color:var(--mu);margin:6px 18px 0;min-height:1.5em;line-height:1.5}
.vfx{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 18px 0}
.vfx .btn{flex:0 1 auto;padding:12px 18px;font-size:15px}
.fin{display:block;flex:none;margin:12px auto 0;max-width:360px;width:calc(100% - 40px)}
.ctl{display:flex;justify-content:center;align-items:center;gap:26px;padding:14px 0 20px}
.rb{position:relative;width:66px;height:66px;border-radius:50%;border:1px solid var(--gt);display:grid;place-items:center;font-size:25px;cursor:pointer;color:var(--tx);background:linear-gradient(150deg,var(--g1),var(--g2));box-shadow:inset 0 1.5px 0 var(--ge),0 10px 26px var(--gs);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:transform .15s,background .2s}
.rb:active{transform:scale(.93)}
.rb.end{background:linear-gradient(150deg,#ff6b78,#d93a4a);color:#fff;border-color:rgba(255,255,255,.45)}
.rb.off{background:linear-gradient(150deg,#ffffff,#dde3ec);color:#c0392b}
.rb.mic::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px solid var(--ac);opacity:0;transform:scale(var(--lv,1));transition:transform .08s linear,opacity .25s;pointer-events:none}
.rb.mic.on::after{opacity:.85}
/* landing (idle) */
.land{display:none;flex-direction:column;align-items:center;text-align:center;padding:0 22px 22px}
.cv.idle .land{display:flex}.cv.idle .cap,.cv.idle .vst,.cv.idle .ctl,.cv.idle .fin,.cv.idle .vfx,.cv.idle .topic{display:none!important}
.kin{font-size:clamp(28px,8vw,40px);font-weight:700;line-height:1.25;letter-spacing:-.4px;margin:0 0 6px}
.kin span{display:inline-block;opacity:0;animation:wp .6s cubic-bezier(.2,1.4,.3,1) forwards}
.kin em{font-style:normal;background:linear-gradient(90deg,var(--ac),var(--ac2));-webkit-background-clip:text;background-clip:text;color:transparent}
.kin2{font-size:15px;color:var(--mu);margin:0 0 18px;opacity:0;animation:wp .6s 1.3s forwards}
.go{position:relative;width:92px;height:92px;border-radius:50%;border:1px solid rgba(255,255,255,.5);cursor:pointer;color:#fff;font-size:34px;display:grid;place-items:center;background:linear-gradient(150deg,var(--ac),var(--ac2));box-shadow:inset 0 2px 0 rgba(255,255,255,.6),0 16px 40px color-mix(in srgb,var(--ac2) 50%,transparent);opacity:0;animation:wp .6s 1.6s forwards}
.go::before,.go::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:2px solid var(--ac);animation:ring 2.2s ease-out infinite}
.go::after{animation-delay:1.1s}
@keyframes ring{from{transform:scale(1);opacity:.8}to{transform:scale(1.7);opacity:0}}
.gol{margin:12px 0 0;font-weight:600;font-size:15px;opacity:0;animation:wp .6s 1.8s forwards}
.res{margin-top:10px;background:none;border:0;color:var(--ac);font:inherit;font-size:14px;text-decoration:underline;cursor:pointer;padding:6px}
.disc{margin:10px 0 0;font-size:11.5px;color:var(--mu);line-height:1.5;max-width:420px}

h1,h2,h3,h4,.kin,.topic .tw,.logo,.lg,.btn,.vn,.vt,.tag,.gol,.go,.vis h4,.sum b,.tile b{font-family:'Kanit','Anuphan',sans-serif;letter-spacing:-.2px}

.topic .tw{font-weight:600;font-size:17.5px}
.vis{position:absolute;left:10px;top:66px;z-index:3;width:min(58%,300px);padding:12px 12px 10px;border-radius:24px;color:#fff;background:linear-gradient(160deg,rgba(18,30,62,.86),rgba(10,18,40,.8));border:1px solid rgba(255,255,255,.18);box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 24px 50px rgba(0,0,0,.35);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);opacity:0;transform:translateX(-24px) scale(.94);filter:blur(6px);transition:opacity .45s,transform .55s cubic-bezier(.2,1.3,.3,1),filter .45s;cursor:pointer}
.vis.in{opacity:1;transform:none;filter:none}
.vis h4{margin:2px 4px 6px;font-size:16px;font-weight:700;line-height:1.3;background:linear-gradient(90deg,#fff,#bfe9ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.vis svg{display:block;width:100%;height:auto;font-family:'Kanit','Anuphan',sans-serif}
.vis p{margin:6px 4px 0;font-size:12.5px;line-height:1.45;color:#c9d6ee}
@media (prefers-reduced-motion:reduce){.kin span,.kin2,.go,.gol,.topic,.topic .em,.topic .tw span{animation:none!important;opacity:1}}
